version: '3.8'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: khan
      POSTGRES_PASSWORD: khan_password
      POSTGRES_DB: khan_store
    ports:
      - '5432:5432'
    volumes:
      - khan_pgdata:/var/lib/postgresql/data

volumes:
  khan_pgdata:
